name: mirror-faa

# Manual only: faa.gov returns 403 to GitHub's runners (checked 2026-10-29), so a schedule
# would just fail weekly. Re-add `schedule: [{cron: "17 9 * * 1"}]` if that changes.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  faa:
    runs-on: ubuntu-latest
    steps:
      - uses: astral-sh/setup-uv@v6
      - name: Install govint
        run: uv tool install git+https://github.com/NPCmillionaire/govint
      - name: Build and publish the FAA registry mirror
        env:
          GH_TOKEN: ${{ github.token }}
        run: govint mirror faa --out out --publish "${{ github.repository }}"
